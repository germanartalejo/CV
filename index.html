<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Currículum | En construcción</title>
	<style>
		:root {
			color-scheme: dark;
		}
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #111;
			color: #f5f5f5;
			font-family:
				system-ui,
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				sans-serif;
		}
		main {
			text-align: center;
			padding: 2rem;
		}
		h1 {
			font-size: clamp(2rem, 6vw, 4rem);
			font-weight: 700;
			letter-spacing: 0.08em;
		}
		p {
			margin-top: 1rem;
			font-size: clamp(1rem, 2vw, 1.25rem);
			color: #b0b0b0;
		}
		.hidden-link {
			position: fixed;
			bottom: 0;
			right: 0;
			width: 60px;
			height: 60px;
			background: transparent;
			border: none;
			cursor: default;
			display: block;
		}
	</style>
</head>
<body>
	<main>
		<h1>En construcción</h1>
		<p>
			Mi currículum web estará disponible próximamente.
		</p>
	</main>
	<a href="test.html" class="hidden-link" aria-hidden="true" tabindex="-1"></a>
</body>
</html>
